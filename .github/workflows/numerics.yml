name: numerics
on:
  push:
    paths: ['src/**', 'data/fetch*.sh', 'requirements.txt', '.github/workflows/numerics.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Fetch release files
        run: cd data && ./fetch.sh && ./fetch_systematics.sh
      - name: Sign check (step zero)
        run: |
          cd src && python sign_check.py | tee /tmp/sign.log
          grep -q "MU + biasCor         alpha=+0.155 beta=+3.116" /tmp/sign.log
      - name: Bracket headline
        run: |
          cd src && python bracket.py | tee /tmp/bracket.log
          grep -q "SWING = +11.7" /tmp/bracket.log
          grep -q "Delta chi2 (B - A) = +1.1" /tmp/bracket.log
          grep -q "Delta chi2 (B - A) = +12.8" /tmp/bracket.log
      - name: Projection identity
        run: |
          cd src && python projection.py | tee /tmp/proj.log
          grep -q "rho_C = -0.068" /tmp/proj.log
          grep -q "L_fixed = -10.14" /tmp/proj.log
      - name: Probes
        run: |
          cd src && python probes.py | tee /tmp/probes.log
          grep -q "beta = 3.11588" /tmp/probes.log
      - name: Envelope
        run: |
          cd src && python envelope.py | tee /tmp/env.log
          grep -q "INSIDE" /tmp/env.log && grep -q "OUTSIDE" /tmp/env.log
      - name: Systematic modes
        run: |
          cd src && python bbc_systematic_modes.py | tee /tmp/modes.log
          grep -q "quadrature of max shifts: 0.71" /tmp/modes.log
