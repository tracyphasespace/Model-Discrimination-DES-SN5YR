name: numerics
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'data/fetch*.sh', 'requirements.txt', 'README.md',
            'paper/main.tex', 'frozen_results.json',
            '.github/workflows/numerics.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Fetch release files (with hash verification)
        run: cd data && ./fetch.sh && ./fetch_systematics.sh
      - name: Sign-convention behavior check (qualitative)
        run: |
          cd src && python sign_check.py | tee /tmp/sign.log
          # the MU+biasCor row must be the best reconstruction (smallest rms)
          python - <<'PY'
          import re
          rows = {}
          for line in open('/tmp/sign.log'):
              m = re.match(r'(MU.*?)\s+alpha=', line)
              if m:
                  rms = float(re.search(r'rms=([\d.]+)', line).group(1))
                  rows[m.group(1).strip()] = rms
          assert min(rows, key=rows.get).startswith('MU + biasCor'), rows
          print('convention check OK:', rows)
          PY
      - name: Verify computations against frozen manifest
        run: cd src && python verify_frozen.py
      - name: Cross-surface sync gate (manifest -> README, main.tex)
        run: python src/check_sync.py
      - name: Smoke-run remaining scripts (no assertions here; truth lives in the manifest)
        run: |
          cd src
          python bracket.py > /dev/null
          python robustness.py > /dev/null
          python projection.py > /dev/null
          python envelope.py > /dev/null
